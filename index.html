
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presenze - Millennium Bug AlPub</title>
    
    <!-- Firebase SDKs (Versione Compatibile) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-primary: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.6);
            --accent: #007aff;
            --accent-hover: #0062cc;
            --accent-light: #e5f1ff;
            --text: #1c1c1e;
            --text-secondary: #8e8e93;
            --border: rgba(60, 60, 67, 0.12);
            --success: #34c759;
            --success-bg: #eafbe8;
            --danger: #ff3b30;
            --danger-bg: #ffebeb;
            --warning: #ff9500;
            --warning-bg: #fff8e6;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text);
            padding: 20px 16px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        /* Header in stile iOS Banner */
        header {
            text-align: center;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            color: white;
            padding: 28px 20px;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        header p {
            opacity: 0.85;
            font-size: 0.88rem;
            font-weight: 400;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 8px #30d158;
        }

        /* Segmented Control (Apple Style Tab Bar) */
        .nav-tabs {
            display: flex;
            background: rgba(120, 120, 128, 0.12);
            padding: 3px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .tab-btn {
            flex: 1;
            padding: 9px 12px;
            background: transparent;
            color: var(--text);
            border: none;
            border-radius: calc(var(--radius-md) - 3px);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--text);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
        }

        /* User Bar */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text);
            padding: 12px 18px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .btn-switch {
            background: var(--accent-light);
            color: var(--accent);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-switch:hover {
            background: #d0e4ff;
        }

        /* User Selection Screen */
        #userSelectionScreen {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 28px 20px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        #userSelectionScreen h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .user-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 8px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .user-btn:hover {
            border-color: var(--accent);
            background: var(--accent);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.25);
        }

        /* Match Cards */
        .match-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .match-card:hover {
            box-shadow: var(--shadow-md);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .match-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .match-info {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .badge {
            background: rgba(120, 120, 128, 0.12);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Option Buttons */
        .status-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .opt-btn {
            padding: 10px 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-secondary);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .opt-btn.yes.active {
            background: var(--success);
            color: #ffffff;
            border-color: var(--success);
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }

        .opt-btn.no.active {
            background: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }

        .opt-btn.maybe.active {
            background: var(--warning);
            color: #ffffff;
            border-color: var(--warning);
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3);
        }

        /* Team Summary Inside Cards */
        .team-summary {
            margin-top: 12px;
            font-size: 0.8rem;
            background: rgba(120, 120, 128, 0.06);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            display: flex;
            gap: 16px;
            font-weight: 600;
        }

        .summary-details {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .summary-details strong {
            color: var(--text);
        }

        /* Table Matrix */
        .matrix-container {
            overflow-x: auto;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 12px;
            box-shadow: var(--shadow-sm);
        }

        table.matrix {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: center;
        }

        table.matrix th, table.matrix td {
            padding: 10px 8px;
            border: 1px solid var(--border);
            min-width: 48px;
        }

        table.matrix th {
            font-weight: 600;
            color: var(--text-secondary);
        }

        table.matrix th.player-col, table.matrix td.player-name {
            text-align: left;
            background: var(--card-bg);
            position: sticky;
            left: 0;
            z-index: 2;
            font-weight: 600;
        }

        .st-yes { background: var(--success-bg); color: var(--success); font-weight: 700; }
        .st-no { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
        .st-maybe { background: var(--warning-bg); color: var(--warning); font-weight: 700; }
        .st-none { color: #c7c7cc; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>MILLENNIUM BUG ALPUB</h1>
        <p>Campionato CSI Mista Open A1 - Presenze Squadra</p>
        <div class="sync-badge">
            <div class="sync-dot"></div> Sincronizzato in Tempo Reale
        </div>
    </header>

    <div id="navTabs" class="nav-tabs hidden">
        <button id="tabMyBtn" class="tab-btn active" onclick="switchTab('my')">✏️ Le Mie Presenze</button>
        <button id="tabTeamBtn" class="tab-btn" onclick="switchTab('team')">📊 Tabella Presenze Squadra</button>
    </div>

    <div id="userBar" class="user-bar hidden">
        <span>Giocatore: <strong id="currentUserName">---</strong></span>
        <button class="btn-switch" onclick="switchUser()">Cambia Giocatore</button>
    </div>

    <div id="userSelectionScreen">
        <h2>Chi sei?</h2>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 4px;">Seleziona il tuo nome per accedere:</p>
        <div class="user-grid" id="userGrid"></div>
    </div>

    <main id="matchesContainer" class="hidden"></main>

    <div id="matrixContainer" class="matrix-container hidden">
        <table class="matrix" id="matrixTable"></table>
    </div>

    <script>
        // Configurazione Firebase integrata
        const firebaseConfig = {
            apiKey: "AIzaSyB-lB6qlfQKCBCWzbXj88tpJIN1IQ0_Pzw",
            authDomain: "millenniumbugalpub-a3a6c.firebaseapp.com",
            databaseURL: "https://millenniumbugalpub-a3a6c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "millenniumbugalpub-a3a6c",
            storageBucket: "millenniumbugalpub-a3a6c.firebasestorage.app",
            messagingSenderId: "228956547857",
            appId: "1:228956547857:web:21c5766095a0d1eb6e7ab0",
            measurementId: "G-VD2ZFG3HE2"
        };

        // Inizializzazione Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Elenco Giocatori Aggiornato (16)
        const PLAYERS = [
            "Alby", "Angy", "Anto", "Dani", "Fra", 
            "Gianlu", "Gio", "Giuly", "Ila", "Jack", 
            "Kiki", "Marti", "Paul", "Rob", "Vanni", "Waiz"
        ];

        const MATCHES = [
            { id: 1, round: "Andata", date: "08/10", title: "vs ASCOT TRIANTE NSC", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 2, round: "Andata", date: "15/10", title: "ZERONOVE 172 vs MB", location: "VIA VALVASSORI PERONI 48, MILANO" },
            { id: 3, round: "Andata", date: "22/10", title: "CAMPAGNOLA vs MB", location: "VIA TARRA 8, LISSONE" },
            { id: 4, round: "Andata", date: "29/10", title: "S.GIORGIO LIMITO vs MB", location: "P.ZA DON MILANI, PIOLTELLO" },
            { id: 5, round: "Andata", date: "05/11", title: "VITTORINI vs MB", location: "VIA TOSI 21, MILANO" },
            { id: 6, round: "Andata", date: "10/11", title: "PANTIGLIATE vs MB", location: "VIA STELLA POLARE 11/A, MEDIGLIA" },
            { id: 7, round: "Andata", date: "19/11", title: "vs POLISPORTIVA FUTURA", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 8, round: "Ritorno", date: "29/11", title: "ASCOT TRIANTE vs MB", location: "VIA DUCA D'AOSTA 8/A, MONZA" },
            { id: 9, round: "Ritorno", date: "10/12", title: "vs ZERONOVE 172", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 10, round: "Ritorno", date: "17/01", title: "vs CAMPAGNOLA DON BOSCO", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 11, round: "Ritorno", date: "21/01", title: "vs S.GIORGIO LIMITO SGL", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 12, round: "Ritorno", date: "28/01", title: "vs VITTORINI", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 13, round: "Ritorno", date: "04/02", title: "vs PANTIGLIATE POL.", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 14, round: "Ritorno", date: "12/02", title: "POL. FUTURA vs MB", location: "VIA DA VINCI 18, PADERNO DUGNANO" }
        ];

        let currentUser = localStorage.getItem('mb_user') || null;
        let activeTab = 'my';
        let attendanceData = {};

        // Sincronizzazione in TEMPO REALE
        db.ref('attendance').on('value', (snapshot) => {
            attendanceData = snapshot.val() || {};
            if (currentUser) {
                if (activeTab === 'my') renderMatches();
                else renderMatrix();
            }
        });

        function initUserGrid() {
            const grid = document.getElementById('userGrid');
            grid.innerHTML = PLAYERS.map(p => `
                <button class="user-btn" onclick="selectUser('${p}')">${p}</button>
            `).join('');
            if (currentUser && PLAYERS.includes(currentUser)) selectUser(currentUser);
        }

        function selectUser(userName) {
            currentUser = userName;
            localStorage.setItem('mb_user', userName);
            document.getElementById('currentUserName').innerText = userName;
            document.getElementById('userSelectionScreen').classList.add('hidden');
            document.getElementById('navTabs').classList.remove('hidden');
            document.getElementById('userBar').classList.remove('hidden');
            switchTab('my');
        }

        function switchUser() {
            currentUser = null;
            localStorage.removeItem('mb_user');
            document.getElementById('userSelectionScreen').classList.remove('hidden');
            document.getElementById('navTabs').classList.add('hidden');
            document.getElementById('userBar').classList.add('hidden');
            document.getElementById('matchesContainer').classList.add('hidden');
            document.getElementById('matrixContainer').classList.add('hidden');
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tabMyBtn').classList.toggle('active', tab === 'my');
            document.getElementById('tabTeamBtn').classList.toggle('active', tab === 'team');

            if (tab === 'my') {
                document.getElementById('matchesContainer').classList.remove('hidden');
                document.getElementById('matrixContainer').classList.add('hidden');
                renderMatches();
            } else {
                document.getElementById('matchesContainer').classList.add('hidden');
                document.getElementById('matrixContainer').classList.remove('hidden');
                renderMatrix();
            }
        }

        function setPresence(matchId, status) {
            if (!currentUser) return;
            const currentStatus = (attendanceData[matchId] || {})[currentUser];
            const newStatus = (currentStatus === status) ? null : status;

            if (newStatus === null) {
                db.ref(`attendance/${matchId}/${currentUser}`).remove();
            } else {
                db.ref(`attendance/${matchId}/${currentUser}`).set(newStatus);
            }
        }

        function renderMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = MATCHES.map(m => {
                const matchData = attendanceData[m.id] || {};
                const userStatus = matchData[currentUser];

                const yesList = PLAYERS.filter(p => matchData[p] === 'YES');
                const noList = PLAYERS.filter(p => matchData[p] === 'NO');
                const maybeList = PLAYERS.filter(p => matchData[p] === 'MAYBE');

                return `
                    <div class="match-card">
                        <div class="match-header">
                            <div>
                                <div class="match-title">${m.title}</div>
                                <div class="match-info">📅 ${m.date} | 📍 ${m.location}</div>
                            </div>
                            <span class="badge">${m.round}</span>
                        </div>

                        <div class="status-options">
                            <button class="opt-btn yes ${userStatus === 'YES' ? 'active' : ''}" onclick="setPresence(${m.id}, 'YES')">Ci sarò</button>
                            <button class="opt-btn maybe ${userStatus === 'MAYBE' ? 'active' : ''}" onclick="setPresence(${m.id}, 'MAYBE')">In forse</button>
                            <button class="opt-btn no ${userStatus === 'NO' ? 'active' : ''}" onclick="setPresence(${m.id}, 'NO')">Assente</button>
                        </div>

                        <div class="team-summary">
                            <span style="color:var(--success)">Sì: ${yesList.length}</span>
                            <span style="color:var(--warning)">Forse: ${maybeList.length}</span>
                            <span style="color:var(--danger)">No: ${noList.length}</span>
                        </div>

                        <div class="summary-details">
                            ${yesList.length > 0 ? `<div><strong>Presenti:</strong> ${yesList.join(', ')}</div>` : ''}
                            ${maybeList.length > 0 ? `<div><strong>In forse:</strong> ${maybeList.join(', ')}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMatrix() {
            const table = document.getElementById('matrixTable');
            let headerHTML = `<thead><tr><th class="player-col">Giocatore</th>`;
            MATCHES.forEach(m => {
                headerHTML += `<th>P${m.id}<br><small style="font-weight:400;">${m.date}</small></th>`;
            });
            headerHTML += `</tr></thead>`;

            let bodyHTML = `<tbody>`;
            PLAYERS.forEach(p => {
                bodyHTML += `<tr><td class="player-name">${p}</td>`;
                MATCHES.forEach(m => {
                    const st = (attendanceData[m.id] || {})[p];
                    let icon = '-';
                    let cssClass = 'st-none';
                    if (st === 'YES') { icon = '✓'; cssClass = 'st-yes'; }
                    else if (st === 'NO') { icon = '✕'; cssClass = 'st-no'; }
                    else if (st === 'MAYBE') { icon = '?'; cssClass = 'st-maybe'; }
                    
                    bodyHTML += `<td class="${cssClass}">${icon}</td>`;
                });
                bodyHTML += `</tr>`;
            });

            bodyHTML += `<tr style="background:rgba(120, 120, 128, 0.08); font-weight:bold;"><td class="player-name">Tot. Sì</td>`;
            MATCHES.forEach(m => {
                const count = PLAYERS.filter(p => (attendanceData[m.id] || {})[p] === 'YES').length;
                bodyHTML += `<td style="color:var(--success)">${count}</td>`;
            });
            bodyHTML += `</tr></tbody>`;

            table.innerHTML = headerHTML + bodyHTML;
        }

        initUserGrid();
    </script>
</body>
</html>

```
