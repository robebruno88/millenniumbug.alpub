<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presenze - Millennium Bug AlPub</title>
    
    <!-- Firebase SDKs (Versione Compatibile) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-primary: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.88);
            --accent: #007aff;
            --accent-hover: #0062cc;
            --accent-light: #e5f1ff;
            --text: #1c1c1e;
            --text-secondary: #8e8e93;
            --border: rgba(60, 60, 67, 0.12);
            --success: #34c759;
            --success-bg: #eafbe8;
            --danger: #ff3b30;
            --danger-bg: #ffebeb;
            --warning: #ff9500;
            --warning-bg: #fff8e6;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text);
            padding: 20px 16px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            color: white;
            padding: 24px 20px;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        header p {
            opacity: 0.88;
            font-size: 0.85rem;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 8px #30d158;
        }

        .widget-upcoming {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .widget-upcoming-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .upcoming-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .upcoming-card {
            background: linear-gradient(135deg, rgba(229, 241, 255, 0.9), rgba(255, 255, 255, 0.95));
            border: 2px solid var(--accent);
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.15);
            border-radius: var(--radius-md);
            padding: 14px;
            position: relative;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
        }

        .upcoming-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .upcoming-card-type {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 6px;
            background: var(--accent);
            color: #ffffff;
        }

        .upcoming-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .upcoming-card-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .nav-tabs {
            display: flex;
            background: rgba(120, 120, 128, 0.12);
            padding: 3px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            color: var(--text);
            border: none;
            border-radius: calc(var(--radius-md) - 3px);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--text);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 0.88rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .user-bar-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-switch {
            background: var(--accent-light);
            color: var(--accent);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .btn-subtle {
            background: rgba(120, 120, 128, 0.12);
            color: var(--text-secondary);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-subtle.active {
            background: var(--text);
            color: #ffffff;
        }

        #userSelectionScreen {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 28px 20px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .user-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 8px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .user-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .admin-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .admin-card h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }

        .admin-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .admin-form-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-field {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: #ffffff;
            font-size: 0.85rem;
            outline: none;
            color: var(--text);
            width: 100%;
        }

        .btn-admin-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-admin-action:hover {
            background: var(--accent-hover);
        }

        .item-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .item-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
        }

        .item-info {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .badge {
            background: rgba(120, 120, 128, 0.12);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .admin-controls {
            display: inline-flex;
            gap: 6px;
            margin-left: 8px;
        }

        .btn-edit-match, .btn-delete-match {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .btn-edit-match { color: var(--accent); background: var(--accent-light); }
        .btn-delete-match { color: var(--danger); background: var(--danger-bg); }

        .status-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .opt-btn {
            padding: 10px 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-secondary);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .opt-btn.yes.active { background: var(--success); color: #ffffff; border-color: var(--success); box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3); }
        .opt-btn.no.active { background: var(--danger); color: #ffffff; border-color: var(--danger); box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3); }
        .opt-btn.maybe.active { background: var(--warning); color: #ffffff; border-color: var(--warning); box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3); }

        .team-summary {
            margin-top: 12px;
            font-size: 0.8rem;
            background: rgba(120, 120, 128, 0.06);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            display: flex;
            gap: 16px;
            font-weight: 600;
        }

        .summary-details {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .opponent-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .opponent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .opponent-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        .opponent-details {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .opponent-actions {
            display: flex;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.88;
        }

        .btn-whatsapp { background: #25d366; color: white; }
        .btn-email { background: var(--accent); color: white; }

        .matrix-container {
            overflow-x: auto;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 12px;
            box-shadow: var(--shadow-sm);
        }

        table.matrix {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: center;
        }

        table.matrix th, table.matrix td {
            padding: 10px 8px;
            border: 1px solid var(--border);
            min-width: 48px;
        }

        table.matrix th.player-col, table.matrix td.player-name {
            text-align: left;
            background: var(--card-bg);
            position: sticky;
            left: 0;
            z-index: 2;
            font-weight: 600;
        }

        .st-yes { background: var(--success-bg); color: var(--success); font-weight: 700; }
        .st-no { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
        .st-maybe { background: var(--warning-bg); color: var(--warning); font-weight: 700; }
        .st-none { color: #c7c7cc; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>MILLENNIUM BUG ALPUB</h1>
        <p>Campionato CSI Mista Open A1 - Presenze Squadra</p>
        <div class="sync-badge">
            <div class="sync-dot"></div> Sincronizzato in Tempo Reale
        </div>
    </header>

    <div id="userBar" class="user-bar hidden">
        <span>Giocatore: <strong id="currentUserName">---</strong></span>
        <div class="user-bar-actions">
            <button id="btnSectionOpponents" class="btn-subtle" onclick="toggleOpponents()">👥 Avversari</button>
            <button class="btn-switch" onclick="switchUser()">Cambia</button>
        </div>
    </div>

    <div id="upcomingWidget" class="widget-upcoming hidden">
        <div class="widget-upcoming-title">
            <span>⚡ Prossime Partite</span>
        </div>
        <div id="upcomingGrid" class="upcoming-grid"></div>
    </div>

    <div id="navTabs" class="nav-tabs hidden">
        <button id="tabMyBtn" class="tab-btn active" onclick="switchTab('my')">✏️ Le Mie Presenze</button>
        <button id="tabTeamBtn" class="tab-btn" onclick="switchTab('team')">📊 Tabella Squadra</button>
    </div>

    <div id="userSelectionScreen">
        <h2>Chi sei?</h2>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 4px;">Seleziona il tuo nome per accedere:</p>
        <div class="user-grid" id="userGrid"></div>
    </div>

    <div id="adminMatchSection" class="admin-card hidden">
        <h3 id="adminFormTitle">➕ Aggiungi / Modifica Partita</h3>
        <input type="hidden" id="adminMatchId">
        <div class="admin-form-grid">
            <input type="text" id="adminDate" class="input-field" placeholder="Data (es: 17/11)">
            <select id="adminRound" class="input-field">
                <option value="Andata">Andata</option>
                <option value="Ritorno">Ritorno</option>
            </select>
            <input type="text" id="adminTitle" class="input-field" placeholder="Titolo (es: ZERONOVE 172 vs MillenniumBug.AlPub)">
            <input type="text" id="adminLocation" class="input-field" placeholder="Luogo e Indirizzo">
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn-admin-action" onclick="saveMatchAdmin()">Salva Partita</button>
            <button id="btnCancelEdit" class="btn-subtle hidden" onclick="cancelEditMatch()">Annulla</button>
        </div>
    </div>

    <main id="itemsContainer" class="hidden"></main>

    <div id="opponentsContainer" class="hidden"></div>

    <div id="matrixContainer" class="matrix-container hidden">
        <table class="matrix" id="matrixTable"></table>
    </div>
