<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presenze - Millennium Bug AlPub</title>
    
    <!-- Firebase SDKs (Versione Compatibile) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-primary: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.88);
            --accent: #007aff;
            --accent-hover: #0062cc;
            --accent-light: #e5f1ff;
            --text: #1c1c1e;
            --text-secondary: #8e8e93;
            --border: rgba(60, 60, 67, 0.12);
            --success: #34c759;
            --success-bg: #eafbe8;
            --danger: #ff3b30;
            --danger-bg: #ffebeb;
            --warning: #ff9500;
            --warning-bg: #fff8e6;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text);
            padding: 20px 16px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        /* Header Apple Style */
        header {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            color: white;
            padding: 24px 20px;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        header p {
            opacity: 0.88;
            font-size: 0.85rem;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 8px #30d158;
        }

        /* Widget Prossimi Eventi */
        .widget-upcoming {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .widget-upcoming-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .upcoming-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .upcoming-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            position: relative;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
        }

        .upcoming-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .upcoming-card.is-match {
            background: linear-gradient(135deg, rgba(229, 241, 255, 0.9), rgba(255, 255, 255, 0.95));
            border: 2px solid var(--accent);
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.15);
        }

        .upcoming-card-type {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 6px;
        }

        .type-match {
            background: var(--accent);
            color: #ffffff;
        }

        .type-training {
            background: rgba(120, 120, 128, 0.16);
            color: var(--text-secondary);
        }

        .upcoming-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .upcoming-card-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Home Navigation */
        .home-nav-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .home-nav-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            padding: 14px;
            border-radius: var(--radius-lg);
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-secondary);
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .home-nav-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.3);
        }

        /* Segmented Control */
        .nav-tabs {
            display: flex;
            background: rgba(120, 120, 128, 0.12);
            padding: 3px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            color: var(--text);
            border: none;
            border-radius: calc(var(--radius-md) - 3px);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--text);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
        }

        /* User Bar */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text);
            padding: 12px 18px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .btn-switch {
            background: var(--accent-light);
            color: var(--accent);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* User Selection Screen */
        #userSelectionScreen {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 28px 20px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .user-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 8px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .user-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Add Training Form Card */
        .add-training-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .add-training-card h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .input-field {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: #ffffff;
            font-size: 0.85rem;
            outline: none;
            color: var(--text);
        }

        select.input-field {
            cursor: pointer;
        }

        .btn-add {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background: var(--accent-hover);
        }

        /* Match / Training Cards */
        .item-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .item-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
        }

        .item-info {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .badge {
            background: rgba(120, 120, 128, 0.12);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 8px;
        }

        /* Option Buttons */
        .status-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .opt-btn {
            padding: 10px 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-secondary);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .opt-btn.yes.active { background: var(--success); color: #ffffff; border-color: var(--success); box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3); }
        .opt-btn.no.active { background: var(--danger); color: #ffffff; border-color: var(--danger); box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3); }
        .opt-btn.maybe.active { background: var(--warning); color: #ffffff; border-color: var(--warning); box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3); }

        .team-summary {
            margin-top: 12px;
            font-size: 0.8rem;
            background: rgba(120, 120, 128, 0.06);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            display: flex;
            gap: 16px;
            font-weight: 600;
        }

        .summary-details {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Matrix Table */
        .matrix-container {
            overflow-x: auto;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 12px;
            box-shadow: var(--shadow-sm);
        }

        table.matrix {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: center;
        }

        table.matrix th, table.matrix td {
            padding: 10px 8px;
            border: 1px solid var(--border);
            min-width: 48px;
        }

        table.matrix th.player-col, table.matrix td.player-name {
            text-align: left;
            background: var(--card-bg);
            position: sticky;
            left: 0;
            z-index: 2;
            font-weight: 600;
        }

        .st-yes { background: var(--success-bg); color: var(--success); font-weight: 700; }
        .st-no { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
        .st-maybe { background: var(--warning-bg); color: var(--warning); font-weight: 700; }
        .st-none { color: #c7c7cc; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>MILLENNIUM BUG ALPUB</h1>
        <p>Campionato CSI Mista Open A1 - Presenze Squadra</p>
        <div class="sync-badge">
            <div class="sync-dot"></div> Sincronizzato in Tempo Reale
        </div>
    </header>

    <!-- Widget Prossimi Eventi -->
    <div id="upcomingWidget" class="widget-upcoming hidden">
        <div class="widget-upcoming-title">
            <span>⚡ Prossimi 2 Eventi</span>
        </div>
        <div id="upcomingGrid" class="upcoming-grid"></div>
    </div>

    <!-- Home Switcher: Partite vs Allenamenti -->
    <div id="homeNav" class="home-nav-container hidden">
        <button id="btnSectionMatches" class="home-nav-btn active" onclick="switchSection('matches')">🏆 Partite</button>
        <button id="btnSectionTrainings" class="home-nav-btn" onclick="switchSection('trainings')">🏋 Allenamenti</button>
    </div>

    <!-- Sub-tabs: Mie Presenze vs Tabella Squadra -->
    <div id="navTabs" class="nav-tabs hidden">
        <button id="tabMyBtn" class="tab-btn active" onclick="switchTab('my')">✏️ Le Mie Presenze</button>
        <button id="tabTeamBtn" class="tab-btn" onclick="switchTab('team')">📊 Tabella Squadra</button>
    </div>

    <div id="userBar" class="user-bar hidden">
        <span>Giocatore: <strong id="currentUserName">---</strong></span>
        <button class="btn-switch" onclick="switchUser()">Cambia Giocatore</button>
    </div>

    <div id="userSelectionScreen">
        <h2>Chi sei?</h2>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 4px;">Seleziona il tuo nome per accedere:</p>
        <div class="user-grid" id="userGrid"></div>
    </div>

    <!-- Sezione Allenamenti: Modulo di Aggiunta -->
    <div id="addTrainingSection" class="add-training-card hidden">
        <h3>➕ Aggiungi Nuovo Allenamento</h3>
        <div class="form-row">
            <input type="date" id="newTrainDate" class="input-field">
            <select id="newTrainLocation" class="input-field">
                <option value="Rinascita" selected>Rinascita</option>
                <option value="Narcisi">Narcisi</option>
                <option value="De Nicola">De Nicola</option>
            </select>
            <button class="btn-add" onclick="createTraining()">Crea Allenamento</button>
        </div>
    </div>

    <main id="itemsContainer" class="hidden"></main>

    <div id="matrixContainer" class="matrix-container hidden">
        <table class="matrix" id="matrixTable"></table>
    </div>

    <script>
        // Configurazione Firebase integrata
        const firebaseConfig = {
            apiKey: "AIzaSyB-lB6qlfQKCBCWzbXj88tpJIN1IQ0_Pzw",
            authDomain: "millenniumbugalpub-a3a6c.firebaseapp.com",
            databaseURL: "https://millenniumbugalpub-a3a6c-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "millenniumbugalpub-a3a6c",
            storageBucket: "millenniumbugalpub-a3a6c.firebasestorage.app",
            messagingSenderId: "228956547857",
            appId: "1:228956547857:web:21c5766095a0d1eb6e7ab0",
            measurementId: "G-VD2ZFG3HE2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const PLAYERS = [
            "Alby", "Angy", "Anto", "Dani", "Fra", 
            "Gianlu", "Gio", "Giuly", "Ila", "Jack", 
            "Kiki", "Marti", "Paul", "Rob", "Vanni", "Waiz"
        ];

        // Manteniamo gli ID numerici originali (1, 2, 3...) per preservare le risposte inserite su Firebase
        const MATCHES = [
            { id: 1, type: 'match', round: "Andata", date: "08/10", title: "vs ASCOT TRIANTE NSC", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 2, type: 'match', round: "Andata", date: "15/10", title: "ZERONOVE 172 vs MB", location: "VIA VALVASSORI PERONI 48, MILANO" },
            { id: 3, type: 'match', round: "Andata", date: "22/10", title: "CAMPAGNOLA vs MB", location: "VIA TARRA 8, LISSONE" },
            { id: 4, type: 'match', round: "Andata", date: "29/10", title: "S.GIORGIO LIMITO vs MB", location: "P.ZA DON MILANI, PIOLTELLO" },
            { id: 5, type: 'match', round: "Andata", date: "05/11", title: "VITTORINI vs MB", location: "VIA TOSI 21, MILANO" },
            { id: 6, type: 'match', round: "Andata", date: "10/11", title: "PANTIGLIATE vs MB", location: "VIA STELLA POLARE 11/A, MEDIGLIA" },
            { id: 7, type: 'match', round: "Andata", date: "19/11", title: "vs POLISPORTIVA FUTURA", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 8, type: 'match', round: "Ritorno", date: "29/11", title: "ASCOT TRIANTE vs MB", location: "VIA DUCA D'AOSTA 8/A, MONZA" },
            { id: 9, type: 'match', round: "Ritorno", date: "10/12", title: "vs ZERONOVE 172", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 10, type: 'match', round: "Ritorno", date: "17/01", title: "vs CAMPAGNOLA DON BOSCO", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 11, type: 'match', round: "Ritorno", date: "21/01", title: "vs S.GIORGIO LIMITO SGL", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 12, type: 'match', round: "Ritorno", date: "28/01", title: "vs VITTORINI", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 13, type: 'match', round: "Ritorno", date: "04/02", title: "vs PANTIGLIATE POL.", location: "VIA ROSALBA CARRIERA 14, MILANO" },
            { id: 14, type: 'match', round: "Ritorno", date: "12/02", title: "POL. FUTURA vs MB", location: "VIA DA VINCI 18, PADERNO DUGNANO" }
        ];

        let currentUser = localStorage.getItem('mb_user') || null;
        let activeSection = 'matches'; // 'matches' | 'trainings'
        let activeTab = 'my';         // 'my' | 'team'
        let attendanceData = {};
        let customTrainings = [];

        // Sincronizzazione Realtime Firebase
        db.ref('attendance').on('value', (snapshot) => {
            attendanceData = snapshot.val() || {};
            refreshUI();
        });

        db.ref('trainings').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            customTrainings = Object.keys(data).map(key => ({ id: key, type: 'training', ...data[key] }));
            refreshUI();
        });

        function initUserGrid() {
            const grid = document.getElementById('userGrid');
            grid.innerHTML = PLAYERS.map(p => `
                <button class="user-btn" onclick="selectUser('${p}')">${p}</button>
            `).join('');
            if (currentUser && PLAYERS.includes(currentUser)) selectUser(currentUser);
        }

        function selectUser(userName) {
            currentUser = userName;
            localStorage.setItem('mb_user', userName);
            document.getElementById('currentUserName').innerText = userName;
            document.getElementById('userSelectionScreen').classList.add('hidden');
            document.getElementById('upcomingWidget').classList.remove('hidden');
            document.getElementById('homeNav').classList.remove('hidden');
            document.getElementById('navTabs').classList.remove('hidden');
            document.getElementById('userBar').classList.remove('hidden');
            switchSection(activeSection);
        }

        function switchUser() {
            currentUser = null;
            localStorage.removeItem('mb_user');
            document.getElementById('userSelectionScreen').classList.remove('hidden');
            document.getElementById('upcomingWidget').classList.add('hidden');
            document.getElementById('homeNav').classList.add('hidden');
            document.getElementById('navTabs').classList.add('hidden');
            document.getElementById('userBar').classList.add('hidden');
            document.getElementById('addTrainingSection').classList.add('hidden');
            document.getElementById('itemsContainer').classList.add('hidden');
            document.getElementById('matrixContainer').classList.add('hidden');
        }

        function switchSection(section) {
            activeSection = section;
            document.getElementById('btnSectionMatches').classList.toggle('active', section === 'matches');
            document.getElementById('btnSectionTrainings').classList.toggle('active', section === 'trainings');
            refreshUI();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tabMyBtn').classList.toggle('active', tab === 'my');
            document.getElementById('tabTeamBtn').classList.toggle('active', tab === 'team');
            refreshUI();
        }

        function refreshUI() {
            if (!currentUser) return;

            renderUpcomingWidget();

            const isTrainings = activeSection === 'trainings';
            document.getElementById('addTrainingSection').classList.toggle('hidden', !isTrainings || activeTab !== 'my');

            if (activeTab === 'my') {
                document.getElementById('itemsContainer').classList.remove('hidden');
                document.getElementById('matrixContainer').classList.add('hidden');
                renderItems();
            } else {
                document.getElementById('itemsContainer').classList.add('hidden');
                document.getElementById('matrixContainer').classList.remove('hidden');
                renderMatrix();
            }
        }

        function renderUpcomingWidget() {
            const allEvents = [...MATCHES, ...customTrainings];
            const nextEvents = allEvents.slice(0, 2);
            const grid = document.getElementById('upcomingGrid');

            if (nextEvents.length === 0) {
                grid.innerHTML = `<div style="font-size:0.8rem; color:var(--text-secondary);">Nessun evento in programma.</div>`;
                return;
            }

            grid.innerHTML = nextEvents.map(evt => {
                const isMatch = evt.type === 'match';
                const status = (attendanceData[evt.id] || {})[currentUser];
                let statusBadge = status === 'YES' ? '🟢 Presente' : status === 'NO' ? '🔴 Assente' : status === 'MAYBE' ? '🟡 In forse' : '⚪ Da confermare';

                return `
                    <div class="upcoming-card ${isMatch ? 'is-match' : ''}" onclick="goToEvent('${evt.type}')">
                        <span class="upcoming-card-type ${isMatch ? 'type-match' : 'type-training'}">
                            ${isMatch ? '🏆 Partita' : '🏋 Allenamento'}
                        </span>
                        <div class="upcoming-card-title">${evt.title}</div>
                        <div class="upcoming-card-info">📅 ${evt.date} | 📍 ${evt.location}</div>
                        <div style="font-size:0.75rem; font-weight:600; margin-top:8px; color:var(--text-secondary);">
                            Stato personale: <strong>${statusBadge}</strong>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function goToEvent(type) {
            if (type === 'match') switchSection('matches');
            else switchSection('trainings');
        }

        function createTraining() {
            const dateVal = document.getElementById('newTrainDate').value;
            const locationVal = document.getElementById('newTrainLocation').value;

            if (!dateVal) {
                alert("Seleziona una data per l'allenamento.");
                return;
            }

            const formattedDate = dateVal.split('-').reverse().slice(0, 2).join('/');
            const newRef = db.ref('trainings').push();
            newRef.set({
                title: "Allenamento",
                date: formattedDate,
                location: locationVal
            });

            document.getElementById('newTrainDate').value = "";
        }

        function deleteTraining(id) {
            if (confirm("Vuoi davvero eliminare questo allenamento?")) {
                db.ref(`trainings/${id}`).remove();
                db.ref(`attendance/${id}`).remove();
            }
        }

        function setPresence(itemId, status) {
            if (!currentUser) return;
            const currentStatus = (attendanceData[itemId] || {})[currentUser];
            const newStatus = (currentStatus === status) ? null : status;

            if (newStatus === null) {
                db.ref(`attendance/${itemId}/${currentUser}`).remove();
            } else {
                db.ref(`attendance/${itemId}/${currentUser}`).set(newStatus);
            }
        }

        function getActiveList() {
            return activeSection === 'matches' ? MATCHES : customTrainings;
        }

        function renderItems() {
            const list = getActiveList();
            const container = document.getElementById('itemsContainer');

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-secondary);">Nessun elemento presente.</div>`;
                return;
            }

            container.innerHTML = list.map(item => {
                const itemData = attendanceData[item.id] || {};
                const userStatus = itemData[currentUser];

                const yesList = PLAYERS.filter(p => itemData[p] === 'YES');
                const noList = PLAYERS.filter(p => itemData[p] === 'NO');
                const maybeList = PLAYERS.filter(p => itemData[p] === 'MAYBE');

                return `
                    <div class="item-card">
                        <div class="item-header">
                            <div>
                                <div class="item-title">${item.title}</div>
                                <div class="item-info">📅 ${item.date} | 📍 ${item.location}</div>
                            </div>
                            <div>
                                ${item.round ? `<span class="badge">${item.round}</span>` : ''}
                                ${activeSection === 'trainings' ? `<button class="btn-delete" onclick="deleteTraining('${item.id}')">Elimina</button>` : ''}
                            </div>
                        </div>

                        <div class="status-options">
                            <button class="opt-btn yes ${userStatus === 'YES' ? 'active' : ''}" onclick="setPresence('${item.id}', 'YES')">Ci sarò</button>
                            <button class="opt-btn maybe ${userStatus === 'MAYBE' ? 'active' : ''}" onclick="setPresence('${item.id}', 'MAYBE')">In forse</button>
                            <button class="opt-btn no ${userStatus === 'NO' ? 'active' : ''}" onclick="setPresence('${item.id}', 'NO')">Assente</button>
                        </div>

                        <div class="team-summary">
                            <span style="color:var(--success)">Sì: ${yesList.length}</span>
                            <span style="color:var(--warning)">Forse: ${maybeList.length}</span>
                            <span style="color:var(--danger)">No: ${noList.length}</span>
                        </div>

                        <div class="summary-details">
                            ${yesList.length > 0 ? `<div><strong>Presenti:</strong> ${yesList.join(', ')}</div>` : ''}
                            ${maybeList.length > 0 ? `<div><strong>In forse:</strong> ${maybeList.join(', ')}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMatrix() {
            const list = getActiveList();
            const table = document.getElementById('matrixTable');

            if (list.length === 0) {
                table.innerHTML = `<tr><td style="padding:20px;">Nessun dato disponibile.</td></tr>`;
                return;
            }

            let headerHTML = `<thead><tr><th class="player-col">Giocatore</th>`;
            list.forEach((item, idx) => {
                headerHTML += `<th>${activeSection === 'matches' ? 'P' + (idx+1) : 'A' + (idx+1)}<br><small style="font-weight:400;">${item.date}</small></th>`;
            });
            headerHTML += `</tr></thead>`;

            let bodyHTML = `<tbody>`;
            PLAYERS.forEach(p => {
                bodyHTML += `<tr><td class="player-name">${p}</td>`;
                list.forEach(item => {
                    const st = (attendanceData[item.id] || {})[p];
                    let icon = '-';
                    let cssClass = 'st-none';
                    if (st === 'YES') { icon = '✓'; cssClass = 'st-yes'; }
                    else if (st === 'NO') { icon = '✕'; cssClass = 'st-no'; }
                    else if (st === 'MAYBE') { icon = '?'; cssClass = 'st-maybe'; }
                    
                    bodyHTML += `<td class="${cssClass}">${icon}</td>`;
                });
                bodyHTML += `</tr>`;
            });

            bodyHTML += `<tr style="background:rgba(120, 120, 128, 0.08); font-weight:bold;"><td class="player-name">Tot. Sì</td>`;
            list.forEach(item => {
                const count = PLAYERS.filter(p => (attendanceData[item.id] || {})[p] === 'YES').length;
                bodyHTML += `<td style="color:var(--success)">${count}</td>`;
            });
            bodyHTML += `</tr></tbody>`;

            table.innerHTML = headerHTML + bodyHTML;
        }

        initUserGrid();
    </script>
</body>
</html>
