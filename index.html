    <style>
        :root {
            --bg-primary: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.88);
            --accent: #007aff;
            --accent-hover: #0062cc;
            --accent-light: #e5f1ff;
            --text: #1c1c1e;
            --text-secondary: #8e8e93;
            --border: rgba(60, 60, 67, 0.12);
            --success: #34c759;
            --success-bg: #eafbe8;
            --danger: #ff3b30;
            --danger-bg: #ffebeb;
            --warning: #ff9500;
            --warning-bg: #fff8e6;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text);
            padding: 20px 16px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        /* Header Apple Style */
        header {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            color: white;
            padding: 24px 20px;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        header p {
            opacity: 0.88;
            font-size: 0.85rem;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 8px #30d158;
        }

        /* Widget Prossimi Eventi */
        .widget-upcoming {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .widget-upcoming-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .upcoming-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .upcoming-card {
            background: linear-gradient(135deg, rgba(229, 241, 255, 0.9), rgba(255, 255, 255, 0.95));
            border: 2px solid var(--accent);
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.15);
            border-radius: var(--radius-md);
            padding: 14px;
            position: relative;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
        }

        .upcoming-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .upcoming-card-type {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 6px;
            background: var(--accent);
            color: #ffffff;
        }

        .upcoming-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .upcoming-card-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Segmented Control */
        .nav-tabs {
            display: flex;
            background: rgba(120, 120, 128, 0.12);
            padding: 3px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            color: var(--text);
            border: none;
            border-radius: calc(var(--radius-md) - 3px);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--text);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
        }

        /* User Bar e Tasto Avversari Discreto */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 0.88rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .user-bar-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-switch {
            background: var(--accent-light);
            color: var(--accent);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .btn-subtle {
            background: rgba(120, 120, 128, 0.12);
            color: var(--text-secondary);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-subtle.active {
            background: var(--text);
            color: #ffffff;
        }

        /* User Selection Screen */
        #userSelectionScreen {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 28px 20px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .user-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 8px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .user-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .admin-card h3 {

            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }

        .admin-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .admin-form-grid {

            }

        .input-field {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: #ffffff;
            font-size: 0.85rem;
            outline: none;
            color: var(--text);
            width: 100%;

        .btn-admin-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-admin-action:hover {
            background: var(--accent-hover);
        }

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);

        .item-header {

            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;

        .item-title {

            font-weight: 700;
            color: var(--text);

        .item-info {

            font-weight: 600;

            gap: 6px;
            margin-left: 8px;

            font-size: 0.78rem;
            font-weight: 600;

            border-radius: 6px;

        .btn-edit-match { color: var(--accent); background: var(--accent-light); }
        .btn-delete-match { color: var(--danger); background: var(--danger-bg); }

            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);

        .opt-btn {

            font-size: 0.8rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-secondary);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);

        .opt-btn.no.active { background: var(--danger); color: #ffffff; border-color: var(--danger); box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3); }
        .opt-btn.maybe.active { background: var(--warning); color: #ffffff; border-color: var(--warning); box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3); }

            font-size: 0.8rem;
            background: rgba(120, 120, 128, 0.06);

            border-radius: var(--radius-md);

            gap: 16px;

            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;

        .opponent-card {

            border-radius: var(--radius-lg);

            font-weight: 700;

            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 14px;

            display: flex;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--border);

        .action-btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;

            opacity: 0.88;

            background: #25d366;
            color: white;
        }

            background: var(--accent);

            overflow-x: auto;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 12px;
            box-shadow: var(--shadow-sm);
        }

        table.matrix {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: center;
        }

        table.matrix th, table.matrix td {
            padding: 10px 8px;
            border: 1px solid var(--border);
            min-width: 48px;
        }

        table.matrix th.player-col, table.matrix td.player-name {
            text-align: left;
            background: var(--card-bg);
            position: sticky;
            left: 0;
            z-index: 2;
            font-weight: 600;
        }

        .st-yes { background: var(--success-bg); color: var(--success); font-weight: 700; }
        .st-no { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
        .st-maybe { background: var(--warning-bg); color: var(--warning); font-weight: 700; }
        .st-none { color: #c7c7cc; }

        .hidden { display: none !important; }
    </style>
</head>

            {

                manager: "SANDRINI CLAUDIA",
                phone: "3275797750",
                email: "claudiasandrini@hotmail.com",
                colors: "GIALLA",
                gym: "PALAZZETTO DELLO SPORT",
                address: "P.ZA DON MILANI, PIOLTELLO",

            {

                colors: "BLU/ARANCIO",
                gym: "PALA DELTA T",
                address: "VIA DUCA D'AOSTA 8/A, MONZA",
                homeGame: "DOMENICA 20:30",
                waLink: "https://wa.me/393355625997"
            }
        ];

        let currentUser = localStorage.getItem('mb_user') || null;
        let activeSection = 'matches'; // 'matches' | 'opponents'
        let activeTab = 'my';         // 'my' | 'team'
        let attendanceData = {};
        let matchesData = [];

        // Inizializzazione e ascolto Realtime delle Partite da Firebase
        db.ref('matches').on('value', (snapshot) => {
            const val = snapshot.val();
            if (!val) {
                // Se il nodo matches su Firebase non esiste ancora, lo popoliamo col calendario iniziale
                db.ref('matches').set(INITIAL_MATCHES);
                matchesData = INITIAL_MATCHES;
            } else {
                matchesData = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
            }
            refreshUI();
        });

        // Sincronizzazione Realtime delle Presenze da Firebase
        db.ref('attendance').on('value', (snapshot) => {
            attendanceData = snapshot.val() || {};
            refreshUI();
        });

        function isAdmin() {
            return ADMIN_USERS.includes(currentUser);
        }

        function initUserGrid() {
            const grid = document.getElementById('userGrid');
            grid.innerHTML = PLAYERS.map(p => `
                <button class="user-btn" onclick="selectUser('${p}')">${p}</button>
            `).join('');
            if (currentUser && PLAYERS.includes(currentUser)) selectUser(currentUser);
        }

        function selectUser(userName) {
            currentUser = userName;
            localStorage.setItem('mb_user', userName);
            document.getElementById('currentUserName').innerText = userName;
            document.getElementById('userSelectionScreen').classList.add('hidden');
            document.getElementById('upcomingWidget').classList.remove('hidden');
            document.getElementById('navTabs').classList.remove('hidden');
            document.getElementById('userBar').classList.remove('hidden');
            refreshUI();
        }

        function switchUser() {
            currentUser = null;
            localStorage.removeItem('mb_user');
            document.getElementById('userSelectionScreen').classList.remove('hidden');
            document.getElementById('upcomingWidget').classList.add('hidden');
            document.getElementById('navTabs').classList.add('hidden');
            document.getElementById('userBar').classList.add('hidden');
            document.getElementById('adminMatchSection').classList.add('hidden');
            document.getElementById('itemsContainer').classList.add('hidden');
            document.getElementById('opponentsContainer').classList.add('hidden');
            document.getElementById('matrixContainer').classList.add('hidden');
        }

        function toggleOpponents() {
            if (activeSection === 'opponents') {
                activeSection = 'matches';
            } else {
                activeSection = 'opponents';
            }
            refreshUI();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tabMyBtn').classList.toggle('active', tab === 'my');
            document.getElementById('tabTeamBtn').classList.toggle('active', tab === 'team');
            refreshUI();
        }

        function refreshUI() {
            if (!currentUser) return;

            const isOpponents = activeSection === 'opponents';

            document.getElementById('btnSectionOpponents').classList.toggle('active', isOpponents);
            document.getElementById('navTabs').classList.toggle('hidden', isOpponents);
            document.getElementById('upcomingWidget').classList.toggle('hidden', isOpponents);
            document.getElementById('opponentsContainer').classList.toggle('hidden', !isOpponents);

            // Se l'utente è Rob o Waiz, mostra il pannello di gestione della partita
            document.getElementById('adminMatchSection').classList.toggle('hidden', !isAdmin() || isOpponents || activeTab !== 'my');

            if (isOpponents) {
                document.getElementById('itemsContainer').classList.add('hidden');
                document.getElementById('matrixContainer').classList.add('hidden');
                renderOpponents();
            } else {
                renderUpcomingWidget();
                if (activeTab === 'my') {
                    document.getElementById('itemsContainer').classList.remove('hidden');
                    document.getElementById('matrixContainer').classList.add('hidden');
                    renderMatches();
                } else {
                    document.getElementById('itemsContainer').classList.add('hidden');
                    document.getElementById('matrixContainer').classList.remove('hidden');
                    renderMatrix();
                }
            }
        }

        function renderUpcomingWidget() {
            const nextEvents = matchesData.slice(0, 2);
            const grid = document.getElementById('upcomingGrid');

            if (nextEvents.length === 0) {
                grid.innerHTML = `<div style="font-size:0.8rem; color:var(--text-secondary);">Nessuna partita in programma.</div>`;
                return;
            }

            grid.innerHTML = nextEvents.map(evt => {
                const status = (attendanceData[evt.id] || {})[currentUser];
                let statusBadge = status === 'YES' ? '🟢 Presente' : status === 'NO' ? '🔴 Assente' : status === 'MAYBE' ? '🟡 In forse' : '⚪ Da confermare';

                return `
                    <div class="upcoming-card">
                        <span class="upcoming-card-type">🏆 Partita</span>
                        <div class="upcoming-card-title">${evt.title}</div>
                        <div class="upcoming-card-info">📅 ${evt.date} | 📍 ${evt.location}</div>
                        <div style="font-size:0.75rem; font-weight:600; margin-top:8px; color:var(--text-secondary);">
                            Stato personale: <strong>${statusBadge}</strong>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setPresence(itemId, status) {
            if (!currentUser) return;
            const currentStatus = (attendanceData[itemId] || {})[currentUser];
            const newStatus = (currentStatus === status) ? null : status;

            if (newStatus === null) {
                db.ref(`attendance/${itemId}/${currentUser}`).remove();
            } else {
                db.ref(`attendance/${itemId}/${currentUser}`).set(newStatus);
            }
        }

        function renderMatches() {
            const container = document.getElementById('itemsContainer');

            if (matchesData.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-secondary);">Nessuna partita in programma.</div>`;
                return;
            }

            container.innerHTML = matchesData.map(item => {
                const itemData = attendanceData[item.id] || {};
                const userStatus = itemData[currentUser];

                const yesList = PLAYERS.filter(p => itemData[p] === 'YES');
                const noList = PLAYERS.filter(p => itemData[p] === 'NO');
                const maybeList = PLAYERS.filter(p => itemData[p] === 'MAYBE');

                return `
                    <div class="item-card">
                        <div class="item-header">
                            <div>
                                <div class="item-title">${item.title}</div>
                                <div class="item-info">📅 ${item.date} | 📍 ${item.location}</div>
                            </div>
                            <div>
                                <span class="badge">${item.round}</span>
                                ${isAdmin() ? `
                                    <div class="admin-controls">
                                        <button class="btn-edit-match" onclick="editMatchAdmin(${item.id})">✏️ Edit</button>
                                        <button class="btn-delete-match" onclick="deleteMatchAdmin(${item.id})">🗑️ Elimina</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="status-options">
                            <button class="opt-btn yes ${userStatus === 'YES' ? 'active' : ''}" onclick="setPresence(${item.id}, 'YES')">Ci sarò</button>
                            <button class="opt-btn maybe ${userStatus === 'MAYBE' ? 'active' : ''}" onclick="setPresence(${item.id}, 'MAYBE')">In forse</button>
                            <button class="opt-btn no ${userStatus === 'NO' ? 'active' : ''}" onclick="setPresence(${item.id}, 'NO')">Assente</button>
                        </div>

                        <div class="team-summary">
                            <span style="color:var(--success)">Sì: ${yesList.length}</span>
                            <span style="color:var(--warning)">Forse: ${maybeList.length}</span>
                            <span style="color:var(--danger)">No: ${noList.length}</span>
                        </div>

                        <div class="summary-details">
                            ${yesList.length > 0 ? `<div><strong>Presenti:</strong> ${yesList.join(', ')}</div>` : ''}
                            ${maybeList.length > 0 ? `<div><strong>In forse:</strong> ${maybeList.join(', ')}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Funzioni Amministrative per Aggiungere / Modificare / Eliminare Partite
        function saveMatchAdmin() {
            if (!isAdmin()) return;

            const idVal = document.getElementById('adminMatchId').value;
            const dateVal = document.getElementById('adminDate').value.trim();
            const roundVal = document.getElementById('adminRound').value;
            const titleVal = document.getElementById('adminTitle').value.trim();
            const locationVal = document.getElementById('adminLocation').value.trim();

            if (!dateVal || !titleVal || !locationVal) {
                alert("Compila tutti i campi richiesti (Data, Titolo, Luogo).");
                return;
            }

            let updatedList = [...matchesData];

            if (idVal) {
                // Modifica partita esistente
                const idx = updatedList.findIndex(m => m.id == idVal);
                if (idx !== -1) {
                    updatedList[idx] = { id: Number(idVal), round: roundVal, date: dateVal, title: titleVal, location: locationVal };
                }
            } else {
                // Nuova partita
                const maxId = updatedList.reduce((max, item) => item.id > max ? item.id : max, 0);
                const newMatch = {
                    id: maxId + 1,
                    round: roundVal,
                    date: dateVal,
                    title: titleVal,
                    location: locationVal
                };
                updatedList.push(newMatch);
            }

            db.ref('matches').set(updatedList);
            cancelEditMatch();
        }

        function editMatchAdmin(id) {
            if (!isAdmin()) return;

            const match = matchesData.find(m => m.id == id);
            if (!match) return;

            document.getElementById('adminMatchId').value = match.id;
            document.getElementById('adminDate').value = match.date;
            document.getElementById('adminRound').value = match.round;
            document.getElementById('adminTitle').value = match.title;
            document.getElementById('adminLocation').value = match.location;

            document.getElementById('adminFormTitle').innerText = "✏️ Modifica Partita #" + match.id;
            document.getElementById('btnCancelEdit').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteMatchAdmin(id) {
            if (!isAdmin()) return;

            if (confirm("Sei sicuro di voler eliminare questa partita?")) {
                const updatedList = matchesData.filter(m => m.id != id);
                db.ref('matches').set(updatedList);
                db.ref(`attendance/${id}`).remove();
            }
        }

        function cancelEditMatch() {
            document.getElementById('adminMatchId').value = "";
            document.getElementById('adminDate').value = "";
            document.getElementById('adminTitle').value = "";
            document.getElementById('adminLocation').value = "";
            document.getElementById('adminFormTitle').innerText = "➕ Aggiungi / Modifica Partita";
            document.getElementById('btnCancelEdit').classList.add('hidden');
        }

        function renderOpponents() {
            const container = document.getElementById('opponentsContainer');
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h3 style="font-size:1.1rem; font-weight:700;">Squadre Avversarie</h3>
                    <button class="btn-subtle" onclick="toggleOpponents()">✕ Chiudi</button>
                </div>
            ` + OPPONENTS.map(opp => `
                <div class="opponent-card">
                    <div class="opponent-header">
                        <div class="opponent-name">${opp.name}</div>
                        <span class="badge" style="background:var(--accent-light); color:var(--accent);">${opp.colors}</span>
                    </div>
                    <div class="opponent-details">
                        👤 <strong>Responsabile:</strong> ${opp.manager}<br>
                        📍 <strong>Palestra:</strong> ${opp.gym} (${opp.address})<br>
                        🕒 <strong>Casa:</strong> ${opp.homeGame}
                    </div>
                    <div class="opponent-actions">
                        <a href="${opp.waLink}" target="_blank" class="action-btn btn-whatsapp">
                            💬 WhatsApp
                        </a>
                        <a href="mailto:${opp.email}" class="action-btn btn-email">
                            ✉️ Email
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function renderMatrix() {
            const table = document.getElementById('matrixTable');

            if (matchesData.length === 0) {
                table.innerHTML = `<tr><td style="padding:20px;">Nessuna partita presente.</td></tr>`;
                return;
            }

            let headerHTML = `<thead><tr><th class="player-col">Giocatore</th>`;
            matchesData.forEach((item, idx) => {
                headerHTML += `<th>P${idx+1}<br><small style="font-weight:400;">${item.date}</small></th>`;
            });
            headerHTML += `</tr></thead>`;

            let bodyHTML = `<tbody>`;
            PLAYERS.forEach(p => {
                bodyHTML += `<tr><td class="player-name">${p}</td>`;
                matchesData.forEach(item => {
                    const st = (attendanceData[item.id] || {})[p];
                    let icon = '-';
                    let cssClass = 'st-none';
                    if (st === 'YES') { icon = '✓'; cssClass = 'st-yes'; }
                    else if (st === 'NO') { icon = '✕'; cssClass = 'st-no'; }
                    else if (st === 'MAYBE') { icon = '?'; cssClass = 'st-maybe'; }
                    
                    bodyHTML += `<td class="${cssClass}">${icon}</td>`;
                });
                bodyHTML += `</tr>`;
            });

            bodyHTML += `<tr style="background:rgba(120, 120, 128, 0.08); font-weight:bold;"><td class="player-name">Tot. Sì</td>`;
            matchesData.forEach(item => {
                const count = PLAYERS.filter(p => (attendanceData[item.id] || {})[p] === 'YES').length;
                bodyHTML += `<td style="color:var(--success)">${count}</td>`;
            });
            bodyHTML += `</tr></tbody>`;

            table.innerHTML = headerHTML + bodyHTML;
        }

        initUserGrid();
    </script>
</body>
</html>
