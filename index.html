<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presenze - Millennium Bug AlPub</title>
    
    <!-- Firebase SDKs (Versione Compatibile) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>

    <style>
        :root {
            --bg-primary: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.88);
            --accent: #007aff;
            --accent-hover: #0062cc;
            --accent-light: #e5f1ff;
            --text: #1c1c1e;
            --text-secondary: #8e8e93;
            --border: rgba(60, 60, 67, 0.12);
            --success: #34c759;
            --success-bg: #eafbe8;
            --danger: #ff3b30;
            --danger-bg: #ffebeb;
            --warning: #ff9500;
            --warning-bg: #fff8e6;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text);
            padding: 20px 16px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        /* Header Apple Style */
        header {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            color: white;
            padding: 24px 20px;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        header p {
            opacity: 0.88;
            font-size: 0.85rem;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            background-color: #30d158;
            border-radius: 50%;
            box-shadow: 0 0 8px #30d158;
        }

        /* Widget Prossimi Eventi */
        .widget-upcoming {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .widget-upcoming-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .upcoming-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .upcoming-card {
            background: linear-gradient(135deg, rgba(229, 241, 255, 0.9), rgba(255, 255, 255, 0.95));
            border: 2px solid var(--accent);
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.15);
            border-radius: var(--radius-md);
            padding: 14px;
            position: relative;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
        }

        .upcoming-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .upcoming-card-type {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 6px;
            background: var(--accent);
            color: #ffffff;
        }

        .upcoming-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .upcoming-card-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Segmented Control */
        .nav-tabs {
            display: flex;
            background: rgba(120, 120, 128, 0.12);
            padding: 3px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            color: var(--text);
            border: none;
            border-radius: calc(var(--radius-md) - 3px);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--text);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
        }

        /* User Bar e Tasto Avversari Discreto */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 0.88rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .user-bar-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-switch {
            background: var(--accent-light);
            color: var(--accent);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .btn-subtle {
            background: rgba(120, 120, 128, 0.12);
            color: var(--text-secondary);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-subtle.active {
            background: var(--text);
            color: #ffffff;
        }

        /* User Selection Screen */
        #userSelectionScreen {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 28px 20px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow-md);
        }
